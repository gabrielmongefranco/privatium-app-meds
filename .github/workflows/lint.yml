name: Lint

on:
  push:
  pull_request:
  # release.yml calls this with the release tag, so the tagged code is what gets checked.
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to check out; empty means the commit that triggered the run
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # The Privatium release the app is tested with. Keep it in step with the README.
  PRIVATIUM_VERSION: v0.3.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download the pinned Privatium release
        run: |
          curl -sSL -o privatium-linux.tar.gz \
            "https://github.com/gabrielmongefranco/privatium/releases/download/${PRIVATIUM_VERSION}/privatium-linux.tar.gz"
          tar -xzf privatium-linux.tar.gz

      - name: Lint the app
        # An empty data directory, so the lint reads no configuration from the runner.
        run: ./privatium --data-dir "$RUNNER_TEMP/lint-node" lint apps/meds

      - name: Verify refill date calculations
        run: |
          python3 tests/test_supply.py
          python3 tests/test_catalog.py
