name: Release app zip

on:
  release:
    types: [published]
  # Attaches the zip to a release that was published without it, such as one whose run failed.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the published release to build and attach meds.zip to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  attach:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      ### Validate Inputs ###
      # A tag may leave out trailing parts, so v0.9 and v0.9.0 both match version 0.9.0.
      - name: Check that the tag matches the app version
        run: |
          normalize() {
            local version="${1#v}"
            while [ "$(printf '%s' "$version" | tr -cd '.' | wc -c)" -lt 2 ]; do
              version="$version.0"
            done
            printf '%s' "$version"
          }
          app_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' apps/meds/app.toml)"
          if [ -z "$app_version" ]; then
            echo "::error::No version line was found in apps/meds/app.toml."
            exit 1
          fi
          if [ "$(normalize "$RELEASE_TAG")" != "$(normalize "$app_version")" ]; then
            echo "::error::The tag $RELEASE_TAG does not match version $app_version in apps/meds/app.toml. Set the version, merge it, and tag that commit."
            exit 1
          fi
          echo "Tag $RELEASE_TAG matches app version $app_version."

      ### Build The Zip ###
      # git archive takes tracked files only, and the prefix makes meds/ the one top folder.
      - name: Build meds.zip
        run: |
          git archive --format=zip --prefix=meds/ -o meds.zip HEAD:apps/meds
          sha256sum meds.zip > meds.zip.sha256
          unzip -l meds.zip | tail -n 1
          cat meds.zip.sha256

      ### Attach To The Release ###
      - name: Attach meds.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" meds.zip meds.zip.sha256 --clobber
