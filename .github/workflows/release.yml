# Summary: When a release is published, lints the tagged code, checks that the tag matches the
#          version in apps/meds/app.toml, and attaches meds.zip and its SHA-256 checksum to the
#          release. meds.zip holds the app folder only, so it unzips straight into Privatium's
#          apps folder. Can also be run by hand for a release that was published without them.
# Notes: See README file for documentation and full license information.
#
