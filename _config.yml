title: Medication Tracker
description: >-
  Track your family's medications, refills, costs, insurance and prior authorizations,
  and know what to refill next, privately on your own computer with Privatium.
repository: gabrielmongefranco/privatium-app-meds
# The owner's GitHub Pages domain serves every project site under its repository name.
url: https://dev.mongefranco.com
baseurl: /privatium-app-meds
lang: en
# Google Analytics measurement ID for the website. The layout adds the Google tag only when
# this is set, so a fork can remove the line to turn analytics off. The app itself never loads it.
google_analytics_id: G-ZM0BWSCDB8

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# These are on by default in GitHub Pages; they are named so a local build matches it.
# relative-links turns links to .md files into links to their pages, readme-index makes each
# README.md its folder's index, and optional-front-matter publishes Markdown without front matter.
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Instruction files for coding assistants that only point to AGENTS.md, and the tools that
# build the starter catalog. Nothing the documentation links to is left out.
exclude:
  - CLAUDE.md
  - CODEX.md
  - CONVENTIONS.md
  - GEMINI.md
  - tools/
