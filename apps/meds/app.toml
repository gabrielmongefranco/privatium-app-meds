[app]
slug        = "meds"
title       = "Prescription Tracker"
version     = "0.8.0"
api         = 1
tier        = "lua"
description = "A personal prescription tracker for families with chronic conditions."
icon        = "capsule"
authors     = ["Gabriel Mongefranco"]
license     = "GPL-3.0-or-later"

[nav]
order     = 10
advertise = true

# Pages change by swapping the main region, so every stylesheet and script is named here
# and loads once in the head of every page. The scripts are deferred and run in this
# order: drug_references.js must come before product_search.js, which reads what it exposes.
[ui]
navigation = "swap"
styles     = ["static/meds.css"]
scripts    = [
  "static/forms.js",
  "static/filter.js",
  "static/person_tab.js",
  "static/drug_references.js",
  "static/product_search.js",
]

[permissions]
# The product search and the lookup of a new medication run in the browser and ask
# three public drug references, in this order: RxTerms, then the openFDA NDC Directory,
# then RxNorm. They send the name that was typed into the box, and nothing else.
remote = [
  "https://clinicaltables.nlm.nih.gov",
  "https://api.fda.gov",
  "https://rxnav.nlm.nih.gov",
]
